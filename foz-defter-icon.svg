<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a2a"/>
      <stop offset="1" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ee0a8"/>
      <stop offset="1" stop-color="#3fb57a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="26" y="26" width="460" height="460" rx="94" fill="none" stroke="#1f2a40" stroke-width="4"/>
  <rect x="48" y="48" width="416" height="416" rx="78" fill="none" stroke="#22304b" stroke-width="6"/>
  <text x="256" y="196" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="700" font-size="132" letter-spacing="4" fill="#ffffff">FOZ</text>
  <!-- open ledger book -->
  <path d="M112 268 Q184 248 252 272 L252 392 Q184 370 112 388 Z" fill="#1b2438" stroke="#5aa8f0" stroke-width="7" stroke-linejoin="round"/>
  <path d="M400 268 Q328 248 260 272 L260 392 Q328 370 400 388 Z" fill="#1b2438" stroke="#5aa8f0" stroke-width="7" stroke-linejoin="round"/>
  <!-- ledger lines on left page -->
  <g stroke="#8b97b0" stroke-width="6" stroke-linecap="round">
    <line x1="136" y1="296" x2="226" y2="300"/>
    <line x1="136" y1="322" x2="226" y2="326"/>
    <line x1="136" y1="348" x2="200" y2="351"/>
  </g>
  <!-- bars on right page -->
  <rect x="282" y="334" width="22" height="38" rx="5" fill="url(#bar)"/>
  <rect x="314" y="314" width="22" height="58" rx="5" fill="url(#bar)"/>
  <rect x="346" y="290" width="22" height="82" rx="5" fill="url(#bar)"/>
  <!-- trend line -->
  <polyline points="278,318 312,298 344,274 378,240" fill="none" stroke="#5aa8f0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="378" cy="240" r="9" fill="#5aa8f0"/>
  <text x="256" y="446" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="38" fill="#b9c3d8">Defter</text>
</svg>
