<style>

<script>
'use strict';
/* =========================================================
   Neon Olimpiyat — FOZ Yapım
   ========================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const dec = (x, d = 2) => x.toFixed(d).replace('.', ',');
const EVENTS = [
  { id: 'yuz', name: '100 Metre', ic: '🏃', low: true, c: '#00f0ff', fmt: v => dec(v) + ' sn',
    how: '“BAŞLA!” yazısından sonra <b>SOL</b> ve <b>SAĞ</b> düğmelerine sırayla, olabildiğince hızlı bas. Aynı düğmeye üst üste basarsan tökezlersin!', keys: 'Klavye: ← ve → tuşlarına sırayla bas.', cpu: { kolay: [15.4, 17.8], orta: [12.4, 13.8], zor: [10.6, 11.8] } },
  { id: 'uzun', name: 'Uzun Atlama', ic: '🦘', c: '#39ff14', tries: 3, fmt: v => dec(v) + ' m',
    how: '<b>SOL–SAĞ</b> ile hızlan. Beyaz tahtaya gelince <b>ATLA</b> düğmesine bas ve <b>basılı tut</b>: açı yükselir. Yaklaşık <b>45°</b>\'de bırak. Tahtayı geçersen faul! 3 hakkın var, en iyisi sayılır.', keys: 'Klavye: ← → koş, Boşluk basılı tut ve bırak.', cpu: { kolay: [3.2, 4.4], orta: [5.0, 6.2], zor: [6.6, 7.8] } },
  { id: 'cirit', name: 'Cirit Atma', ic: '➶', c: '#ffe600', tries: 3, fmt: v => dec(v, 1) + ' m',
    how: '<b>SOL–SAĞ</b> ile hızlan. Kırmızı atış çizgisinden önce <b>AT</b> düğmesine bas, <b>basılı tut</b> ve <b>45°</b> civarında bırak. Çizgiyi geçersen faul! 3 hakkın var.', keys: 'Klavye: ← → koş, Boşluk basılı tut ve bırak.', cpu: { kolay: [26, 38], orta: [44, 56], zor: [58, 70] } },
  { id: 'yuksek', name: 'Yüksek Atlama', ic: '⤴', c: '#ff2bd6', fmt: v => dec(v) + ' m',
    how: 'Sporcu kendisi koşar. Alttaki çubukta gidip gelen ışık <b>yeşil bölgedeyken ZIPLA</b>\'ya bas. Çıta her başarıda yükselir, yeşil bölge daralır. Aynı yükseklikte 3 kez düşürürsen yarışma biter.', keys: 'Klavye: Boşluk.', cpu: { kolay: [1.5, 1.7], orta: [1.75, 1.95], zor: [2.0, 2.2] } },
  { id: 'ok', name: 'Okçuluk', ic: '🏹', c: '#ff8a00', fmt: v => v + ' puan',
    how: 'Nişangâh titreyerek hareket eder. <b>Rüzgârı</b> hesaba kat: <b>SOL–SAĞ</b> ile nişanı kaydır, nişangâh tam yerindeyken <b>ATEŞ</b>\'e bas. 6 okun toplamı sayılır (en fazla 60).', keys: 'Klavye: ← → nişan, Boşluk ateş.', cpu: { kolay: [27, 37], orta: [40, 48], zor: [49, 56] } }
];
const EV = Object.fromEntries(EVENTS.map(e => [e.id, e]));
const PCOL = ['#ff2bd6', '#00f0ff', '#39ff14', '#ffe600'];
const CPUS = [{ name: 'Volt', color: '#9aa3c7' }, { name: 'Turbo', color: '#c9a0ff' }, { name: 'Şimşek', color: '#7fd1b9' }];
const POINTS = [10, 8, 6, 5, 4, 3, 2, 1];
const MEDAL = ['🥇', '🥈', '🥉'];

/* ---------- kayıt ---------- */
const KEY = 'foz-neon-olimpiyat-v1';
let DB = { sound: true, names: ['Oyuncu 1', 'Oyuncu 2', 'Oyuncu 3', 'Oyuncu 4'], count: 1, cpu: true, diff: 'orta', events: EVENTS.map(e => e.id), best: {}, cabinet: {}, practice: 'yuz' };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) DB = Object.assign(DB, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }

/* ---------- ses ---------- */
let AC = null;
function audio() { if (!DB.sound) return null; try { if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); } if (AC.state === 'suspended') AC.resume(); } catch (e) { return null; } return AC; }
function tone(f, d = .08, type = 'square', v = .04, slide = 0, delay = 0) {
  const a = audio(); if (!a) return; const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f * slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .03);
}
function noise(d = .3, v = .05) { const a = audio(); if (!a) return; const b = a.createBuffer(1, a.sampleRate * d, a.sampleRate), ch = b.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length); const s = a.createBufferSource(), g = a.createGain(); s.buffer = b; g.gain.value = v; s.connect(g); g.connect(a.destination); s.start(); }
const sfx = {
  step: () => tone(160, .03, 'triangle', .03),
  stumble: () => tone(120, .1, 'sawtooth', .04, .6),
  beep: hi => tone(hi ? 880 : 440, hi ? .3 : .15, 'square', .05),
  jump: () => tone(300, .25, 'sine', .05, 2.2),
  land: () => noise(.25, .06),
  throw: () => tone(500, .3, 'sawtooth', .025, .4),
  foul: () => [300, 200].forEach((f, i) => tone(f, .2, 'square', .05, 0, i * .18)),
  good: () => [523, 659, 784].forEach((f, i) => tone(f, .1, 'square', .045, 0, i * .07)),
  cheer: () => { noise(.9, .05); [523, 659, 784, 1047].forEach((f, i) => tone(f, .12, 'square', .04, 0, .1 + i * .08)); },
  arrow: () => tone(900, .15, 'triangle', .04, .3),
  hit: () => tone(200, .08, 'square', .05)
};
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const fx = $('fx'), fxc = fx.getContext('2d'); let parts = [], fxOn = false;
function confetti(n = 150) {
  if (REDUCED) n = 25;
  fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; fx.style.width = innerWidth + 'px'; fx.style.height = innerHeight + 'px';
  const C = ['#ff2bd6', '#00f0ff', '#39ff14', '#ffe600', '#ff8a00', '#ffd23f'];
  for (let i = 0; i < n; i++) parts.push({ x: Math.random() * innerWidth, y: -10 - Math.random() * 200, vx: (Math.random() - .5) * 120, vy: 80 + Math.random() * 160, r: Math.random() * 6, c: C[i % 6], s: 4 + Math.random() * 5, t: 0 });
  if (fxOn) return; fxOn = true; let last = performance.now();
  const step = now => { const dt = Math.min(.05, (now - last) / 1000); last = now; fxc.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); fxc.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 40 * dt; fxc.save(); fxc.translate(p.x, p.y); fxc.rotate(p.r + p.t * 5); fxc.fillStyle = p.c; fxc.fillRect(-p.s / 2, -p.s, p.s, p.s * 2); fxc.restore(); }
    parts = parts.filter(p => p.y < innerHeight + 20 && p.t < 6); if (parts.length) requestAnimationFrame(step); else { fxOn = false; fxc.clearRect(0, 0, innerWidth, innerHeight); } };
  requestAnimationFrame(step);
}

/* =========================================================
   ÇİZİM
   ========================================================= */
const cv = $('cv'), ctx = cv.getContext('2d');
const VH = 360, GY = 262, LANE = 300;
let SC = 1, VW = 600;
function fitCanvas() {
  const st = $('stage'), w = st.clientWidth, h0 = st.clientHeight; if (!w || !h0) return;
  const h = Math.min(h0, Math.round(w * .78));
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const dpr = Math.min(devicePixelRatio || 1, 2.5); cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  SC = cv.height / VH; VW = cv.width / SC;
}
addEventListener('resize', () => { if ($('game').classList.contains('active')) fitCanvas(); });
const CROWD = []; for (let i = 0; i < 420; i++) CROWD.push({ x: Math.random() * 900, y: 128 + Math.random() * 96, c: ['#ff2bd6', '#00f0ff', '#ffe600', '#39ff14', '#ffffff', '#b05cff'][i % 6], s: 1.5 + Math.random() * 2, p: Math.random() * 6 });
let TIME = 0;
function stadium(camPx, cheer = 0) {
  const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#0a0526'); g.addColorStop(.55, '#170b40'); g.addColorStop(1, '#07071a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  // projektörler
  for (let i = 0; i < 5; i++) {
    const x = (((i * 240 - camPx * .08) % 1200) + 1200) % 1200 - 150;
    const rg = ctx.createRadialGradient(x + 20, 30, 2, x + 20, 30, 90); rg.addColorStop(0, 'rgba(255,255,255,.35)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg; ctx.fillRect(x - 70, -60, 180, 180);
    ctx.fillStyle = '#fff'; ctx.fillRect(x, 24, 40, 10); ctx.fillStyle = '#556'; ctx.fillRect(x + 18, 34, 4, 90);
  }
  // tribün
  ctx.fillStyle = '#120a35'; ctx.fillRect(0, 120, VW, GY - 120);
  ctx.strokeStyle = 'rgba(176,92,255,.35)'; ctx.lineWidth = 1;
  for (let y = 132; y < GY - 30; y += 16) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(VW, y); ctx.stroke(); }
  const off = ((camPx * .3) % 900 + 900) % 900;
  for (const d of CROWD) {
    for (let k = 0; k < 3; k++) {
      const x = d.x - off + k * 900; if (x < -5 || x > VW + 5) continue;
      const jump = cheer ? Math.max(0, Math.sin(TIME * 12 + d.p)) * 4 * cheer : Math.sin(TIME * 2 + d.p) * .6;
      ctx.fillStyle = d.c; ctx.globalAlpha = .75; ctx.fillRect(x, d.y - jump, d.s, d.s * 1.6); ctx.globalAlpha = 1;
    }
  }
  // reklam panosu
  ctx.fillStyle = '#0a0624'; ctx.fillRect(0, GY - 28, VW, 24);
  ctx.save(); ctx.font = '900 13px system-ui,sans-serif'; ctx.textBaseline = 'middle';
  const txt = '★ FOZ YAPIM ★ NEON OLİMPİYAT ', tw = ctx.measureText(txt).width, o2 = ((camPx * .7) % tw + tw) % tw;
  for (let x = -o2; x < VW; x += tw) { ctx.fillStyle = (Math.floor((x + o2) / tw) % 2) ? '#ff2bd6' : '#00f0ff'; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8; ctx.fillText(txt, x, GY - 16); }
  ctx.restore();
  // pist
  ctx.fillStyle = '#4a1430'; ctx.fillRect(0, GY, VW, VH - GY);
  ctx.fillStyle = '#5c1a3a'; ctx.fillRect(0, GY + 20, VW, 60);
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
  for (const y of [GY + 20, GY + 80]) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(VW, y); ctx.stroke(); }
}
function athlete(x, y, phase, pose, color, opt = {}) {
  ctx.save(); ctx.translate(x, y); if (opt.rot) ctx.rotate(opt.rot);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = color; ctx.shadowBlur = 10;
  const lean = pose === 'run' ? .25 : pose === 'throw' ? -.2 : 0;
  const hip = [0, -24], sh = [lean * 18, -46], head = [lean * 22, -56];
  const seg = (a, b) => { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); };
  const legs = (a1, k1, a2, k2) => {
    for (const [a, k] of [[a1, k1], [a2, k2]]) {
      const knee = [hip[0] + Math.sin(a) * 13, hip[1] + Math.cos(a) * 13], foot = [knee[0] + Math.sin(a - k) * 13, knee[1] + Math.cos(a - k) * 13];
      seg(hip, knee); seg(knee, foot);
    }
  };
  const arms = (b1, b2) => { for (const b of [b1, b2]) { const el = [sh[0] + Math.sin(b) * 11, sh[1] + Math.cos(b) * 11], hand = [el[0] + Math.sin(b + .9) * 10, el[1] + Math.cos(b + .9) * 10]; seg(sh, el); seg(el, hand); } };
  if (pose === 'run') { const s = Math.sin(phase); legs(s * .9, .2 + Math.max(0, -s) * 1.1, -s * .9, .2 + Math.max(0, s) * 1.1); arms(-s * 1.1, s * 1.1); }
  else if (pose === 'jump') { legs(1.1, -.2, .9, -.4); arms(2.4, 2.1); }
  else if (pose === 'land') { legs(1.4, 1.9, 1.2, 2.0); arms(.9, 1.2); }
  else if (pose === 'throw') { const k = opt.k || 0; legs(.5, .3, -.4, .2); arms(Math.PI - .4 - k * 2.6, -.4); }
  else if (pose === 'bow') { legs(.25, 0, -.25, 0); ctx.beginPath(); ctx.moveTo(sh[0], sh[1]); ctx.lineTo(sh[0] + 22, sh[1] - 2); ctx.stroke(); seg(sh, [sh[0] + 6, sh[1] + 8]); }
  else { legs(.12, 0, -.12, 0); arms(.25, -.25); }
  seg(hip, sh); ctx.beginPath(); ctx.arc(head[0], head[1], 7, 0, 7); ctx.fill();
  ctx.restore();
}
function bigText(t, y, color = '#fff7c2', size = 34) {
  ctx.save(); ctx.font = `900 ${size}px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 16; ctx.fillText(t, VW / 2, y); ctx.restore();
}
function label(t, x, y, color = '#fff', size = 12, align = 'center') { ctx.save(); ctx.font = `800 ${size}px system-ui,sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(t, x, y); ctx.restore(); }
function gauge(x, y, ang, active) {
  ctx.save(); ctx.translate(x, y); ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(0, 0, 40, -Math.PI / 2, 0); ctx.stroke();
  ctx.strokeStyle = 'rgba(57,255,20,.7)'; ctx.beginPath(); ctx.arc(0, 0, 40, -50 * Math.PI / 180, -40 * Math.PI / 180); ctx.stroke();
  const a = -ang * Math.PI / 180; ctx.strokeStyle = active ? '#ffd23f' : '#fff'; ctx.lineWidth = 3; ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 46, Math.sin(a) * 46); ctx.stroke();

const held = { L: false, R: false, A: false };
let E = null; // aktif branş
function press(b) { if (held[b]) return; held[b] = true; const el = document.querySelector(`#ctrl [data-b="${b}"]`); if (el) el.classList.add('on'); if (E && E.press) E.press(b); }
function release(b) { if (!held[b]) return; held[b] = false; const el = document.querySelector(`#ctrl [data-b="${b}"]`); if (el) el.classList.remove('on'); if (E && E.release) E.release(b); }
document.querySelectorAll('#ctrl [data-b]').forEach(el => {
  el.addEventListener('pointerdown', e => { e.preventDefault(); audio(); try { el.setPointerCapture(e.pointerId); } catch (_) {} press(el.dataset.b); });
  const up = e => { release(el.dataset.b); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
});
const KMAP = { arrowleft: 'L', a: 'L', arrowright: 'R', d: 'R', ' ': 'A', arrowup: 'A', w: 'A', enter: 'A' };
document.addEventListener('keydown', e => {
  if (document.querySelector('.overlay')) { if (e.key === 'Enter' || e.key === ' ') { const b = document.querySelector('.overlay .btn.primary'); if (b) { e.preventDefault(); b.click(); } } return; }
  if (!$('game').classList.contains('active')) return;
  const b = KMAP[e.key.toLowerCase()]; if (!b) { if (e.key === 'Escape') quitGame(); return; }
  e.preventDefault(); if (e.repeat) return; audio(); press(b);
});
document.addEventListener('keyup', e => { const b = KMAP[e.key.toLowerCase()]; if (b) release(b); });
addEventListener('blur', () => { for (const b in held) release(b); });
function setControls(list, aLabel) {
  for (const b of ['L', 'R', 'A']) document.querySelector(`#ctrl [data-b="${b}"]`).hidden = !list.includes(b);
  $('aLbl').textContent = aLabel || 'ATLA';
  const l = document.querySelector('#ctrl [data-b="L"]'), r = document.querySelector('#ctrl [data-b="R"]');
  if (aLabel === 'ATEŞ') { l.firstChild.textContent = '◀ NİŞAN'; r.firstChild.textContent = 'NİŞAN ▶'; } else { l.firstChild.textContent = 'SOL'; r.firstChild.textContent = 'SAĞ'; }
}

/* =========================================================
   KOŞU MOTORU (100 m, uzun atlama, cirit)
   ========================================================= */
const VMAX = 12.2;
function runner(x0) { return { x: x0, v: 0, last: null, phase: 0, stumble: 0, taps: 0 }; }
function runTap(r, b) {
  if (b === r.last) { r.v *= .88; r.stumble = .35; sfx.stumble(); return; }
  r.last = b; r.taps++; r.v = Math.min(VMAX, r.v + .55); sfx.step();
}
function runStep(r, dt) { r.v = Math.max(0, r.v - r.v * .38 * dt); r.x += r.v * dt; r.phase += r.v * dt * 1.7 + (r.v > .2 ? dt * 2 : 0); if (r.stumble > 0) r.stumble -= dt; }
function speedBar(r) {
  const w = Math.min(160, VW * .4), x = 14, y = 14;
  ctx.fillStyle = 'rgba(10,8,40,.8)'; ctx.fillRect(x, y, w, 12); const p = r.v / VMAX;
  const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, '#00f0ff'); g.addColorStop(.7, '#ffe600'); g.addColorStop(1, '#ff3b5c');
  ctx.fillStyle = g; ctx.fillRect(x, y, w * p, 12); ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.strokeRect(x, y, w, 12);
  label('HIZ ' + dec(r.v * 3.6, 0) + ' km/sa', x, y + 24, '#cfd', 11, 'left');
}

/* ---------- 100 metre ---------- */
function ev100(pl, done) {
  const r = runner(0), PX = 22; let t = 0, state = 'cd', cd = 2.7, lastBeep = 4, fin = null, after = 0, fs = 0;
  const best = DB.best.yuz && DB.best.yuz.v;
  setControls(['L', 'R']);
  return {
    dbg: () => ({ state, x: r.x, v: r.v, t }),
    hud: () => ['Süre', state === 'cd' ? '0,00' : dec(fin != null ? fin : t), 'Mesafe', Math.min(100, Math.floor(r.x)) + ' m'],
    press(b) {
      if (b === 'A') return;
      if (state === 'cd') { if (cd < 1.8) { fs++; cd = 2.7; lastBeep = 4; sfx.foul(); this.msg = 'Erken çıkış! Yeniden'; this.msgT = 1.2; } return; }
      if (state === 'run') runTap(r, b);
    },
    update(dt) {
      if (state === 'cd') { cd -= dt; const k = Math.ceil(cd / .9); if (k !== lastBeep && k >= 0) { lastBeep = k; if (k > 0 && k < 3) sfx.beep(false); } if (cd <= 0) { state = 'run'; sfx.beep(true); } return; }
      if (state === 'run') { t += dt; const px = r.x; runStep(r, dt); if (r.x >= 100 && fin == null) { fin = t - (r.x - 100) / Math.max(r.v, .1); state = 'fin'; sfx.cheer(); } if (t > 60) { fin = 60; state = 'fin'; } }
      else if (state === 'fin') { runStep(r, dt * .6); r.v *= .97; after += dt; if (after > 1.4) { state = 'done'; done({ v: Math.round(fin * 100) / 100, text: dec(fin) + ' sn' }); } }
      if (this.msgT > 0) this.msgT -= dt;
    },
    draw() {
      const cam = r.x * PX - VW * .32; stadium(cam, state === 'fin' ? 1 : 0);
      for (let m = 0; m <= 110; m += 10) { const sx = m * PX - cam; if (sx < -40 || sx > VW + 40) continue; ctx.fillStyle = m === 100 ? '#fff' : 'rgba(255,255,255,.35)'; ctx.fillRect(sx - (m === 100 ? 3 : 1), GY + 20, m === 100 ? 6 : 2, 60); if (m <= 100) label(m + ' m', sx, GY + 92, m === 100 ? '#ffd23f' : '#cbd', 11); }
      const fx0 = 100 * PX - cam; if (fx0 > -50 && fx0 < VW + 50) { ctx.save(); ctx.fillStyle = '#ffd23f'; ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 14; ctx.fillRect(fx0 - 2, GY - 60, 4, 62); ctx.restore(); label('BİTİŞ', fx0, GY - 68, '#ffd23f', 12); }
      if (best && state !== 'cd') { const gx = Math.min(100, 100 * t / best) * PX - cam; ctx.globalAlpha = .35; athlete(gx, LANE + 8, t * best * 1.7, 'run', '#ffffff'); ctx.globalAlpha = 1; label('REKOR', gx, LANE - 72, 'rgba(255,255,255,.5)', 10); }
      athlete(r.x * PX - cam, LANE, r.phase, state === 'cd' ? 'stand' : 'run', pl.color);
      label(pl.name, r.x * PX - cam, LANE - 74, pl.color, 12);
      if (state !== 'cd') speedBar(r);
      if (state === 'cd') bigText(cd > 1.8 ? 'Yerine…' : cd > .9 ? 'Hazır…' : 'Hazır…', 80, '#d6fdff');
      else if (t < .8) bigText('BAŞLA!', 80, '#39ff14');
      if (r.stumble > 0) label('Tökezledin! Sırayla bas', VW / 2, 120, '#ff8095', 15);
      if (this.msgT > 0) bigText(this.msg, 120, '#ff8095', 22);
      if (state === 'fin' || state === 'done') bigText(dec(fin) + ' sn', 80);
    }
  };
}

/* ---------- uzun atlama ve cirit (ortak) ---------- */
function evJump(pl, done, kind) {
  const isJ = kind === 'uzun', start = isJ ? -36 : -26, r = runner(start);
  let state = 'ready', ang = 8, toff = 0, vrun = 0, fl = null, after = 0, res = null, foul = '', camPX = 24;
  setControls(['L', 'R', 'A'], isJ ? 'ATLA' : 'AT');
  const best = DB.best[kind] && DB.best[kind].v;
  const launch = () => {
    sfx[isJ ? 'jump' : 'throw']();
    const a = ang * Math.PI / 180;
    if (isJ) { const v0 = vrun * .78; fl = { x: toff, y: 0, vx: v0 * Math.cos(a), vy: v0 * Math.sin(a) }; }
    else { const s = 9 + vrun * 1.5; fl = { x: toff + .5, y: 1.9, vx: s * Math.cos(a), vy: s * Math.sin(a) }; }
    state = 'fly';
  };
  const doFoul = why => { foul = why; state = 'foul'; sfx.foul(); after = 0; };
  return {
    dbg: () => ({ state, x: r.x, v: r.v, ang }),
    hud: () => ['Hız', dec(r.v * 3.6, 0) + ' km/sa', 'Açı', state === 'ang' || state === 'fly' || state === 'land' ? Math.round(ang) + '°' : '–'],
    press(b) {
      if (b === 'L' || b === 'R') { if (state === 'ready') state = 'run'; if (state === 'run') runTap(r, b); return; }
      if (b === 'A' && state === 'run') {
        if (r.x > .25) return doFoul(isJ ? 'Tahtayı geçtin — faul!' : 'Çizgiyi geçtin — faul!');
        toff = Math.min(0, r.x); vrun = r.v; ang = 8; state = 'ang';
      }
    },
    release(b) { if (b === 'A' && state === 'ang') launch(); },
    update(dt) {
      if (state === 'run') { runStep(r, dt); if (r.x > 1.2) doFoul(isJ ? 'Atlamadan tahtayı geçtin — faul!' : 'Atmadan çizgiyi geçtin — faul!'); }
      else if (state === 'ang') { ang += 62 * dt; r.v *= Math.pow(.6, dt); r.x += r.v * dt * .4; if (ang >= 80) { ang = 80; launch(); } }
      else if (state === 'fly') {
        fl.vy -= 9.81 * dt; fl.x += fl.vx * dt; fl.y += fl.vy * dt;
        if (fl.y <= 0) { fl.y = 0; res = Math.max(0, fl.x); state = 'land'; after = 0; sfx.land(); if (best == null || res > best) sfx.cheer(); else sfx.good(); }
        if (!isJ) camPX = Math.max(7, camPX - dt * 14);
      }
      else if (state === 'land') { after += dt; if (after > 1.5) { state = 'done'; done({ v: Math.round(res * 100) / 100, text: EV[kind].fmt(res) }); } }
      else if (state === 'foul') { after += dt; if (after > 1.6) { state = 'done'; done({ v: null, text: 'Faul (X)' }); } }
    },
    draw() {
      const focus = state === 'fly' || state === 'land' ? fl.x : r.x;
      const PX = isJ ? 26 : camPX;
      const cam = focus * PX - VW * (state === 'fly' || state === 'land' ? .45 : .35);
      stadium(cam, state === 'land' ? 1 : 0);
      const W = x => x * PX - cam;
      // pist işaretleri
      if (isJ) {
        ctx.fillStyle = '#d9b46a'; ctx.globalAlpha = .9; ctx.fillRect(W(1), GY + 22, (11 - 1) * PX, 56); ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(255,230,140,.35)'; for (let i = 0; i < 40; i++) ctx.fillRect(W(1 + (i * 37 % 100) / 10), GY + 26 + (i * 17 % 50), 2, 2);
        for (let m = 3; m <= 10; m++) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(W(m) - 1, GY + 72, 2, 10); label(m + ' m', W(m), GY + 92, '#ffe9a8', 11); }
        ctx.save(); ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 10; ctx.fillRect(W(-.2), GY + 24, .2 * PX + 4, 52); ctx.restore();
        label('TAHTA', W(0), GY + 92, '#fff', 11);
      } else {
        ctx.fillStyle = '#1d5a2a'; ctx.fillRect(W(.2), GY + 20, 130 * PX, 60);
        for (let m = 10; m <= 100; m += 10) { ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(W(m) - 1, GY + 20, 2, 60); label(m + ' m', W(m), GY + 92, '#d6ffd0', 11); }
        ctx.save(); ctx.fillStyle = '#ff3b5c'; ctx.shadowColor = '#ff3b5c'; ctx.shadowBlur = 12; ctx.fillRect(W(0) - 2, GY + 20, 5, 60); ctx.restore();
      }
      for (let m = Math.ceil(start / 5) * 5; m < 0; m += 5) label(-m + '', W(m), GY + 92, 'rgba(255,255,255,.3)', 10);
      if (best != null) { const bx = W(best); ctx.save(); ctx.strokeStyle = 'rgba(255,210,63,.8)'; ctx.setLineDash([6, 5]); ctx.beginPath(); ctx.moveTo(bx, GY - 10); ctx.lineTo(bx, GY + 80); ctx.stroke(); ctx.restore(); label('REKOR ' + EV[kind].fmt(best), bx, GY - 18, '#ffd23f', 11); }
      // sporcu
      if (state === 'fly' && isJ) athlete(W(fl.x), LANE - fl.y * PX, 0, 'jump', pl.color);
      else if (state === 'land' && isJ) athlete(W(fl.x), LANE, 0, 'land', pl.color);
      else if (!isJ && (state === 'ang' || state === 'fly' || state === 'land')) athlete(W(state === 'ang' ? r.x : toff + .6), LANE, 0, 'throw', pl.color, { k: state === 'ang' ? 0 : 1 });
      else athlete(W(r.x), LANE, r.phase, state === 'ready' || state === 'foul' ? 'stand' : 'run', pl.color);
      // cirit
      if (!isJ) {
        const flying = state === 'fly' || state === 'land';
        const ja = flying ? (state === 'land' ? -.55 : Math.atan2(fl.vy, fl.vx)) : (state === 'ang' ? ang * Math.PI / 180 : .15);
        const cx = flying ? W(fl.x) : W(r.x) + 6, cy = flying ? LANE - 8 - fl.y * PX : LANE - 50, L = Math.max(34, 2.6 * PX);
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(-ja); ctx.strokeStyle = '#ffe600'; ctx.lineWidth = 3; ctx.shadowColor = '#ffe600'; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.moveTo(-L / 2, 0); ctx.lineTo(L / 2, 0); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(L / 2 + 6, 0); ctx.lineTo(L / 2 - 2, -3); ctx.lineTo(L / 2 - 2, 3); ctx.fill(); ctx.restore();
        if (flying) label(dec(Math.max(0, fl.x), 1) + ' m', cx, cy - 18, '#ffe600', 12);
      }
      label(pl.name, W(state === 'fly' || state === 'land' ? (isJ ? fl.x : toff) : r.x), LANE - 76, pl.color, 12);
      if (state === 'run' || state === 'ready') speedBar(r);
      if (state === 'ang') gauge(W(r.x) + 34, LANE - 40, ang, true);
      if (state === 'ready') bigText('SOL–SAĞ ile koşmaya başla', 80, '#d6fdff', 20);
      if (state === 'run' && r.x > -8 && r.x < .3) bigText(isJ ? 'ATLA!' : 'AT!', 80, '#ffd23f', 30);
      if (r.stumble > 0 && state === 'run') label('Tökezledin! Sırayla bas', VW / 2, 120, '#ff8095', 15);
      if (state === 'land') bigText(EV[kind].fmt(res) + (best == null || res > best ? '  🏅 REKOR!' : ''), 80);
      if (state === 'foul') bigText(foul, 80, '#ff8095', 22);
    }
  };
}

/* ---------- yüksek atlama ---------- */
function evHigh(pl, done) {
  let h = 1.5, tries = 0, bestH = 0, state = 'intro', t = 0, m = 0, md = 1, hit = null, ax = -9, jt = 0, barFall = 0, msg = '', msgT = 0;
  setControls(['A'], 'ZIPLA');
  const zone = () => clamp(.38 - (h - 1.5) * .62, .07, .38);
  const speed = () => .9 + (h - 1.5) * 1.6;
  const begin = () => { state = 'app'; ax = -9; hit = null; m = Math.random(); md = Math.random() < .5 ? 1 : -1; jt = 0; barFall = 0; };
  const next = ok => {
    if (ok) { bestH = h; tries = 0; msg = 'Geçtin! ' + dec(h) + ' m'; sfx.cheer(); h = Math.round((h + (h < 2 ? .1 : .05)) * 100) / 100; if (h > 2.5) { msg = 'İnanılmaz! En üst çıta!'; return end(); } }
    else { tries++; msg = 'Çıtayı düşürdün (' + tries + '/3)'; sfx.foul(); if (tries >= 3) return end(); }
    msgT = 1.4; state = 'wait'; t = 0;
  };
  const end = () => { state = 'end'; t = 0; msgT = 1.6; };
  begin();
  return {
    dbg: () => ({ state, m, zone: zone(), h, tries, bestH }),
    hud: () => ['Çıta', dec(h) + ' m', 'Deneme', (tries + 1) + '/3'],
    press(b) { if (b !== 'A' || state !== 'app' || hit !== null) return; const c = Math.abs(m - .5); hit = c <= zone() / 2; sfx.jump(); },
    update(dt) {
      t += dt;
      if (state === 'app') {
        m += md * speed() * dt; if (m > 1) { m = 2 - m; md = -1; } if (m < 0) { m = -m; md = 1; }
        ax += 3.4 * dt;
        if (ax >= -.6) { if (hit === null) hit = false; state = 'jump'; jt = 0; }

function evArch(pl, done) {
  const N = 6; let k = 0, total = 0, state = 'aim', t = Math.random() * 10, aim = 0, wind = 0, shots = [], fly = 0, last = null, after = 0;
  setControls(['L', 'R', 'A'], 'ATEŞ');
  const newWind = () => { wind = Math.round(rnd(-3, 3)); aim = 0; };
  newWind();
  const geo = () => { const R = Math.min(105, VW * .3, 120); return { cx: VW / 2, cy: 170, R }; };
  const sway = (tt, R) => { const A = R * (.32 + k * .03); return [Math.sin(tt * 1.25) * A + Math.sin(tt * 2.7 + 1) * A * .45, Math.cos(tt * 1.05) * A * .75 + Math.sin(tt * 2.2 + .5) * A * .35]; };
  return {
    dbg: () => ({ state, k, total, wind }),
    hud: () => ['Ok', Math.min(k + 1, N) + '/' + N, 'Toplam', total + ' puan'],
    press(b) {
      if (state !== 'aim') return;
      if (b === 'A') { const { R } = geo(); const [sx, sy] = sway(t, R); const px = aim + sx + wind * R * .085, py = sy + R * .05; const d = Math.hypot(px, py) / R; const sc = d >= 1 ? 0 : 10 - Math.floor(d * 10); last = { x: px, y: py, s: sc }; state = 'fly'; fly = 0; sfx.arrow(); }
    },
    update(dt) {
      t += dt; const { R } = geo();
      if (state === 'aim') { if (held.L) aim -= R * .55 * dt; if (held.R) aim += R * .55 * dt; aim = clamp(aim, -R * 1.2, R * 1.2); }
      else if (state === 'fly') { fly += dt; if (fly > .35) { shots.push(last); total += last.s; state = 'hit'; after = 0; sfx.hit(); if (last.s >= 9) sfx.cheer(); else if (last.s >= 6) sfx.good(); } }
      else if (state === 'hit') { after += dt; if (after > 1.1) { k++; if (k >= N) { state = 'end'; after = 0; } else { state = 'aim'; newWind(); } } }
      else if (state === 'end') { after += dt; if (after > 1.6) { state = 'done'; done({ v: total, text: total + ' puan' }); } }
    },
    draw() {
      stadium(0); const { cx, cy, R } = geo();
      // hedef
      ctx.fillStyle = '#2b2b45'; ctx.fillRect(cx - 4, cy + R, 8, LANE - cy - R); ctx.fillRect(cx - R * .7, LANE - 4, R * 1.4, 6);
      const ring = ['#ffffff', '#ffffff', '#2a2a3a', '#2a2a3a', '#2f6bff', '#2f6bff', '#ff3b5c', '#ff3b5c', '#ffd23f', '#ffd23f'];
      for (let i = 0; i < 10; i++) { const rr = R * (1 - i / 10); ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7); ctx.fillStyle = ring[i]; ctx.globalAlpha = i < 2 ? .85 : 1; ctx.fill(); ctx.globalAlpha = 1; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1; ctx.stroke(); }
      ctx.save(); ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 20; ctx.strokeStyle = 'rgba(255,210,63,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R + 3, 0, 7); ctx.stroke(); ctx.restore();
      for (const s of shots) { ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(cx + s.x, cy + s.y, 3.5, 0, 7); ctx.fill(); ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx + s.x, cy + s.y); ctx.lineTo(cx + s.x + 9, cy + s.y + 7); ctx.stroke(); }
      // rüzgâr
      const wx = 20, wy = 30; label('RÜZGÂR', wx, wy, '#cfd', 11, 'left');
      ctx.save(); ctx.strokeStyle = '#00f0ff'; ctx.fillStyle = '#00f0ff'; ctx.lineWidth = 3; ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 8;
      const L = Math.abs(wind) * 14, dir = Math.sign(wind);
      if (wind) { ctx.beginPath(); ctx.moveTo(wx + 30 - dir * L / 2, wy + 20); ctx.lineTo(wx + 30 + dir * L / 2, wy + 20); ctx.stroke(); ctx.beginPath(); ctx.moveTo(wx + 30 + dir * (L / 2 + 6), wy + 20); ctx.lineTo(wx + 30 + dir * L / 2, wy + 15); ctx.lineTo(wx + 30 + dir * L / 2, wy + 25); ctx.fill(); }
      ctx.restore(); label(wind ? (wind > 0 ? 'sağa ' : 'sola ') + Math.abs(wind) : 'yok', wx + 30, wy + 38, '#d6fdff', 12);
      athlete(Math.max(40, cx - R - 90), LANE, 0, 'bow', pl.color);
      // nişangâh
      if (state === 'aim') {
        const [sx, sy] = sway(t, R), x = cx + aim + sx, y = cy + sy;
        ctx.save(); ctx.strokeStyle = '#39ff14'; ctx.lineWidth = 2; ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(x, y, 14, 0, 7); ctx.moveTo(x - 22, y); ctx.lineTo(x - 6, y); ctx.moveTo(x + 6, y); ctx.lineTo(x + 22, y); ctx.moveTo(x, y - 22); ctx.lineTo(x, y - 6); ctx.moveTo(x, y + 6); ctx.lineTo(x, y + 22); ctx.stroke(); ctx.restore();
        if (Math.abs(aim) > 2) label('nişan ' + (aim > 0 ? '→' : '←'), cx, cy + R + 18, '#9f9', 11);
      }
      if (state === 'fly') { const p = fly / .35, x = cx + last.x, y = cy + last.y; ctx.save(); ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 3; ctx.globalAlpha = .9; ctx.beginPath(); ctx.moveTo(x + (1 - p) * 120, y + (1 - p) * 60); ctx.lineTo(x + (1 - p) * 120 + 18, y + (1 - p) * 60 + 9); ctx.stroke(); ctx.restore(); }
      if (state === 'hit') bigText(last.s === 10 ? '10! Tam isabet!' : last.s + ' puan', 70, last.s >= 9 ? '#ffd23f' : last.s >= 6 ? '#39ff14' : last.s ? '#d6fdff' : '#ff8095', 28);
      if (state === 'end') bigText('Toplam: ' + total + ' puan', 70);
      label(pl.name, VW - 14, 30, pl.color, 14, 'right');
    }
  };
}

let rafOn = false, lastT = 0;

function rankOf(evId, entries) {
  const low = EV[evId].low;
  const valid = entries.filter(e => e.v != null).sort((a, b) => low ? a.v - b.v : b.v - a.v);
  const out = []; valid.forEach((e, i) => { const prev = out[i - 1]; e.rank = prev && prev.v === e.v ? prev.rank : i; out.push(e); });

  else if (evId === 'cirit') v = Math.round(v * 10) / 10;
  else v = Math.round(v * 100) / 100;

    <div class="evgrid">${EVENTS.map(e => `<button class="ev" data-pr="${e.id}" aria-pressed="true" style="--c:${e.c}"><span class="e">${e.ic}</span>${e.name}</button>`).join('')}</div>
    <div class="card"><b>Rekorlar</b><div class="rec">${EVENTS.map(e => `<span>${e.ic}</span><span>${e.name}${DB.best[e.id] ? ` <small>· ${esc(DB.best[e.id].who)}</small>` : ''}</span><b>${DB.best[e.id] ? e.fmt(DB.best[e.id].v) : '–'}</b>`).join('')}</div></div>
    ${cab.length ? `<div class="card"><b>Madalya dolabı</b><div class="cab">${cab.map(([n, c]) => `<div><span>${esc(n)}</span><span>${c[0]}🥇 ${c[1]}🥈 ${c[2]}🥉 · ${c[3]} 🏆</span></div>`).join('')}</div></div>` : ''}
    <p class="privacy">Reklamsız · Veri toplamaz · İnternetsiz çalışır</p><p class="sig"><b>FOZ</b> Yapım sunar</p>`;
  renderSound();
  $('goO').addEventListener('click', () => { audio(); showScreen('setup'); renderSetup(); });
  $('menuWrap').querySelectorAll('[data-pr]').forEach(b => b.addEventListener('click', () => { audio(); startPractice(b.dataset.pr); }));
}
function renderSetup() {
  $('setupWrap').innerHTML = `
    <span class="lbl">Kaç kişi oynayacak?</span>
    <div class="chips">${[1, 2, 3, 4].map(n => `<button class="chip" data-n="${n}" aria-pressed="${DB.count === n}" style="--c:var(--gold)">${n} kişi</button>`).join('')}</div>
    <div class="card">${Array.from({ length: DB.count }, (_, i) => `<div class="prow"><span class="dot" style="background:${PCOL[i]};color:${PCOL[i]}"></span><input class="txt" data-i="${i}" maxlength="12" value="${esc(DB.names[i] || '')}" placeholder="Oyuncu ${i + 1}" aria-label="${i + 1}. oyuncunun adı"></div>`).join('')}</div>
    <button class="toggle card" id="cpu" role="switch" aria-checked="${DB.cpu}" style="flex-direction:row"><span class="sw"></span><span>Bilgisayar rakipleri katılsın<br><small style="color:var(--muted);font-weight:600">Volt, Turbo ve Şimşek kadroyu 4'e tamamlar</small></span></button>
    <div id="diffBox" ${DB.cpu && DB.count < 4 ? '' : 'hidden'}><span class="lbl" style="display:block;margin-bottom:8px">Rakip seviyesi</span>
    <div class="chips">${[['kolay', 'Kolay'], ['orta', 'Orta'], ['zor', 'Zor']].map(([k, l]) => `<button class="chip" data-d="${k}" aria-pressed="${DB.diff === k}" style="--c:var(--green)">${l}</button>`).join('')}</div></div>
    <span class="lbl">Branşlar</span>
    <div class="evgrid">${EVENTS.map(e => `<button class="ev" data-e="${e.id}" aria-pressed="${DB.events.includes(e.id)}" style="--c:${e.c}"><span class="e">${e.ic}</span>${e.name}</button>`).join('')}</div>
    <button class="btn primary" id="start" ${DB.events.length ? '' : 'disabled'}>BAŞLA ▶</button>
    <p class="note">Oyuncular sırayla yarışır; telefon elden ele dolaşır. Her branşta ilk üç madalya alır, puanlar (10–8–6–5…) toplanır.</p>`;
  const W = $('setupWrap');
  W.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => { DB.count = +b.dataset.n; save(); renderSetup(); }));
  W.querySelectorAll('[data-i]').forEach(inp => inp.addEventListener('input', () => { DB.names[+inp.dataset.i] = inp.value; save(); }));
  $('cpu').addEventListener('click', () => { DB.cpu = !DB.cpu; save(); renderSetup(); });
  W.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => { DB.diff = b.dataset.d; save(); renderSetup(); }));
  W.querySelectorAll('[data-e]').forEach(b => b.addEventListener('click', () => { const id = b.dataset.e; DB.events = DB.events.includes(id) ? DB.events.filter(x => x !== id) : EVENTS.map(e => e.id).filter(x => x === id || DB.events.includes(x)); save(); renderSetup(); }));
  $('start').addEventListener('click', () => { audio(); startOlympics(); });
}
$('quit').addEventListener('click', quitGame);
document.addEventListener('visibilitychange', () => { if (document.hidden) for (const b in held) release(b); });
renderMenu();
window.NeonOlimpiyat = { get E() { return E; }, get O() { return O; }, press, release, startOlympics, startPractice, DB, EVENTS, rankOf, cpuValue };
</script>
</body>
</html>
