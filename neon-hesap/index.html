<style>
:root{
  --bg:#07071a;--pink:#ff2bd6;--cyan:#00f0ff;--green:#39ff14;--yellow:#ffe600;--red:#ff3b5c;--violet:#b05cff;--orange:#ff8a00;
  --text:#ecebff;--muted:#8b8ac0;--panel:rgba(20,16,60,.72);--panel2:rgba(28,22,80,.8);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% -10%,#24104d 0%,var(--bg) 62%) fixed,var(--bg);
  color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,240,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.06) 1px,transparent 1px);background-size:42px 42px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 100%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 100%,#000 0%,transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
input{font:inherit;color:inherit}
#app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px 6px;width:100%;max-width:760px;margin:0 auto}
.bar h2{flex:1;font-size:1.15rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#d6fdff;text-shadow:0 0 10px var(--cyan);text-align:center}
.icon-btn{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--panel);
  border:1.5px solid rgba(0,240,255,.4);box-shadow:0 0 10px rgba(0,240,255,.18);transition:transform .12s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:var(--cyan);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn[aria-pressed="false"]{border-color:rgba(139,138,192,.4);box-shadow:none}
.icon-btn[aria-pressed="false"] svg{stroke:var(--muted)}
.spacer{width:46px;flex:none}
.logo{margin-top:6px;text-align:center;line-height:.95;font-weight:900;letter-spacing:.08em}
.logo .l1{display:block;font-size:clamp(2.8rem,14vw,4.6rem);color:#ffd6f6;text-shadow:0 0 6px var(--pink),0 0 18px var(--pink),0 0 42px var(--pink);animation:flicker 5s infinite}
.logo .l2{display:block;font-size:clamp(2.6rem,13vw,4.3rem);color:#fff7c2;text-shadow:0 0 6px var(--yellow),0 0 18px var(--yellow),0 0 42px #ffb300}
@keyframes flicker{0%,92%,100%{opacity:1}93%{opacity:.55}94%{opacity:1}96%{opacity:.7}97%{opacity:1}}
.tagline{color:var(--muted);text-align:center;font-size:1rem}
.card{background:var(--panel);border:1.5px solid rgba(179,79,255,.35);border-radius:18px;padding:14px}
.prof{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.avatar{--c:var(--pink);flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.3rem;
  color:#14062a;background:var(--c);box-shadow:0 0 14px var(--c)}
.prof .info{flex:1;min-width:0;display:block}
.prof .info>span{display:block}
.prof .nm{font-weight:900;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof .sub{color:var(--muted);font-size:.85rem}
.xpbar{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--yellow));box-shadow:0 0 8px var(--pink)}
.chev{color:var(--cyan);font-size:1.3rem}
.goal{display:flex;align-items:center;gap:12px}
.ring{--p:0;flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.85rem;
  background:conic-gradient(var(--green) calc(var(--p)*1%),rgba(255,255,255,.08) 0);position:relative}
.ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#100b33}
.ring span{position:relative;z-index:1}
.goal .t{font-weight:800}.goal .s{color:var(--muted);font-size:.85rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{--c:var(--cyan);text-align:left;padding:14px;border-radius:18px;background:var(--panel);border:2px solid color-mix(in srgb,var(--c) 55%,transparent);
  box-shadow:0 0 14px color-mix(in srgb,var(--c) 22%,transparent);transition:transform .12s;display:flex;flex-direction:column;gap:4px;min-height:112px}
.mode:active{transform:scale(.97)}
.mode .ic{font-size:1.6rem;font-weight:900;color:var(--c);text-shadow:0 0 10px var(--c)}
.mode b{font-size:1.08rem}
.mode small{color:var(--muted);font-size:.8rem;line-height:1.35}
.mode.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:12px}
.sig{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:center}
.sig b{color:var(--pink);text-shadow:0 0 8px rgba(255,43,214,.7)}
.privacy{font-size:.78rem;color:var(--muted);text-align:center;opacity:.8}
.btn{border-radius:16px;padding:14px 18px;font-weight:900;letter-spacing:.06em;font-size:1.1rem;text-align:center}
.primary{background:linear-gradient(90deg,var(--pink),#a34bff 50%,var(--yellow));color:#16052a;box-shadow:0 0 22px rgba(255,43,214,.4);transition:transform .12s,filter .15s}
.primary:hover{filter:brightness(1.08)}.primary:active{transform:scale(.97)}
.primary:disabled{opacity:.4;filter:grayscale(.6)}
.ghost{background:var(--panel);border:2px solid rgba(0,240,255,.45);color:var(--cyan)}
.danger{background:transparent;border:2px solid rgba(255,59,92,.5);color:#ff8095;font-size:.95rem}
.lbl{font-size:.8rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--c:var(--cyan);padding:9px 13px;border-radius:999px;background:var(--panel);border:2px solid rgba(139,138,192,.35);font-weight:800;font-size:.95rem;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--c);color:var(--c);text-shadow:0 0 8px var(--c);box-shadow:0 0 12px color-mix(in srgb,var(--c) 35%,transparent)}
.chip:disabled{opacity:.3}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades .chip{border-radius:14px;padding:12px 4px;text-align:center}
.txt{width:100%;padding:13px 14px;border-radius:14px;background:rgba(10,8,40,.85);border:2px solid rgba(0,240,255,.4);font-size:1.15rem;font-weight:700}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:42px;height:42px;border-radius:50%;border:3px solid transparent}
.colors button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 12px currentColor}
.plist{display:flex;flex-direction:column;gap:10px}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tp{--c:var(--cyan);display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;background:var(--panel);border:2px solid rgba(139,138,192,.3);text-align:left;font-weight:800;font-size:.92rem}
.tp .ti{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:.9rem;color:var(--c);border:1.5px solid var(--c);text-shadow:0 0 6px var(--c)}
.tp small{display:block;font-weight:600;color:var(--muted);font-size:.72rem}
.tp[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 12px color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.note{color:var(--muted);font-size:.86rem;line-height:1.5;text-align:center}

/* oyun ekranı */
.hud{display:flex;gap:6px;flex:1;min-width:0}
.st{--c:#fff;flex:1;min-width:0;padding:4px;border-radius:12px;background:var(--panel);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);text-align:center}
.st .k{display:block;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden}
.st .v{display:block;font-size:clamp(.9rem,4vw,1.1rem);font-weight:900;color:var(--c);text-shadow:0 0 8px color-mix(in srgb,var(--c) 60%,transparent);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.timebar{height:6px;margin:4px 14px 0;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;max-width:732px;width:calc(100% - 28px);align-self:center}
.timebar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));transition:width .25s linear}
.play{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:6px 14px 12px;gap:10px}
.qcard{position:relative;width:100%;max-width:560px;flex:1;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:16px;border-radius:22px;background:var(--panel);border:2px solid rgba(179,79,255,.45);box-shadow:0 0 30px rgba(179,79,255,.15);text-align:center;overflow:auto}
.qcard.ok{border-color:var(--green);box-shadow:0 0 30px rgba(57,255,20,.35)}
.qcard.bad{border-color:var(--red);box-shadow:0 0 30px rgba(255,59,92,.35);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.qtag{position:absolute;top:10px;left:12px;font-size:.72rem;font-weight:800;letter-spacing:.06em;color:var(--c,var(--cyan));text-transform:uppercase;opacity:.9}
.qtag.r{left:auto;right:12px;color:var(--yellow)}
.q{font-size:clamp(1.7rem,8.5vw,3rem);font-weight:900;line-height:1.25;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 14px rgba(0,240,255,.45)}
.q.long{font-size:clamp(1.05rem,4.6vw,1.45rem);font-weight:700;line-height:1.5;text-shadow:none}
.q .box{display:inline-block;min-width:1.4em;padding:0 .15em;border:2px dashed var(--yellow);border-radius:10px;color:var(--yellow)}
.q i{font-family:Georgia,"Times New Roman",serif;color:var(--yellow)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .12em;font-size:.82em}
.fr>span:first-child{border-bottom:.08em solid currentColor;padding:0 .12em .06em}
.fr>span:last-child{padding:.06em .12em 0}
.ans{min-height:1.5em;font-size:clamp(1.6rem,8vw,2.6rem);font-weight:900;color:var(--yellow);text-shadow:0 0 12px rgba(255,230,0,.5);font-variant-numeric:tabular-nums}
.ans.empty{color:rgba(255,255,255,.18);text-shadow:none}
.feedback{font-weight:900;font-size:1.2rem;min-height:1.3em}
.feedback.ok{color:var(--green);text-shadow:0 0 10px var(--green)}
.explain{width:100%;max-width:560px;border-radius:18px;padding:14px;background:rgba(40,8,30,.85);border:2px solid rgba(255,59,92,.55);display:flex;flex-direction:column;gap:8px;text-align:left}
.explain .ca{font-weight:900;font-size:1.15rem}.explain .ca b{color:var(--green);font-size:1.35rem}
.explain .yours{color:#ff8095;font-size:.9rem}
.explain .how{line-height:1.6;font-size:1rem}
.tipbox{width:100%;max-width:560px;border-radius:14px;padding:10px 12px;background:rgba(255,230,0,.08);border:1.5px solid rgba(255,230,0,.45);color:#fff3a8;font-size:.95rem;line-height:1.5}
.pad{width:100%;max-width:440px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{height:clamp(46px,7.2vh,62px);border-radius:14px;background:var(--panel2);border:1.5px solid rgba(0,240,255,.35);font-size:1.5rem;font-weight:900;color:#fff;transition:transform .08s,background .12s}
.pad button:active{transform:scale(.94);background:rgba(0,240,255,.25)}
.pad .op{color:var(--yellow);border-color:rgba(255,230,0,.4)}
.pad .del{color:#ff8095;border-color:rgba(255,59,92,.45)}
.pad .go{grid-column:span 2;background:linear-gradient(90deg,#1fd16a,var(--green));color:#062a10;border:0;box-shadow:0 0 16px rgba(57,255,20,.4)}
.pad .hid{visibility:hidden}
.row{display:flex;gap:10px;width:100%;max-width:560px}
.row>*{flex:1}
.small{font-size:.92rem;padding:10px 12px}

/* çarpım tablosu */
.tgrid{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;width:100%;max-width:520px}
.tgrid button,.tgrid div{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font-size:clamp(.62rem,2.6vw,.9rem);font-weight:800;font-variant-numeric:tabular-nums}
.tgrid .h{background:rgba(0,240,255,.12);color:var(--cyan);border:1.5px solid rgba(0,240,255,.5)}
.tgrid .h:active{transform:scale(.92)}
.tgrid .c0{background:rgba(255,255,255,.05);color:rgba(255,255,255,.35)}
.tgrid .c1{background:rgba(255,138,0,.25);color:#ffd3a1}
.tgrid .c2{background:rgba(255,230,0,.28);color:#fff6b3}
.tgrid .c3{background:rgba(57,255,20,.38);color:#eaffdf;box-shadow:0 0 6px rgba(57,255,20,.45)}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* ilerleme */
.tbars{display:flex;flex-direction:column;gap:8px}
.tbar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.tbar .n{font-weight:800;font-size:.92rem}.tbar .p{color:var(--muted);font-size:.8rem;text-align:right}
.tbar .b{grid-column:1/-1;height:7px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.tbar .b i{display:block;height:100%;background:var(--c,var(--cyan));box-shadow:0 0 6px var(--c,var(--cyan))}
.stars{color:var(--yellow);letter-spacing:.05em}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{padding:10px 6px;border-radius:14px;background:var(--panel);border:1.5px solid rgba(139,138,192,.25);text-align:center;display:flex;flex-direction:column;gap:3px;align-items:center}
.badge .e{font-size:1.6rem;filter:grayscale(1) opacity(.35)}
.badge b{font-size:.78rem}.badge small{font-size:.66rem;color:var(--muted);line-height:1.25}
.badge.on{border-color:rgba(255,230,0,.6);box-shadow:0 0 12px rgba(255,230,0,.25)}
.badge.on .e{filter:none}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kv div{background:rgba(255,255,255,.04);border-radius:12px;padding:8px 4px}
.kv b{display:block;font-size:1.25rem;color:var(--yellow);font-variant-numeric:tabular-nums}
.kv small{color:var(--muted);font-size:.72rem}

/* yarış */
.race{flex:1;min-height:0;display:flex;gap:8px;padding:8px}
.race.v{flex-direction:column}
.side{--c:var(--pink);flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:20px;background:var(--panel);
  border:2px solid color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--c) 22%,transparent);position:relative;overflow:hidden}
.race.v .side.flip{transform:rotate(180deg)}
.side .top{display:flex;align-items:center;gap:8px}
.side .who{font-weight:900;color:var(--c);text-shadow:0 0 8px var(--c);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .sc{font-weight:900;font-size:1.4rem;font-variant-numeric:tabular-nums}
.side .prog{height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.side .prog i{display:block;height:100%;background:var(--c);box-shadow:0 0 8px var(--c);transition:width .25s}
.side .rq{flex:1;min-height:0;display:grid;place-items:center;text-align:center;font-weight:900;font-size:clamp(1.3rem,6.5vw,2.2rem);line-height:1.25;overflow:hidden;padding:2px}
.side .rq.long{font-size:clamp(.85rem,3.6vw,1.1rem);font-weight:700;line-height:1.4}
.side .rq .box{display:inline-block;min-width:1.2em;border:2px dashed var(--yellow);border-radius:8px;color:var(--yellow)}
.side .rq i{font-family:Georgia,serif;color:var(--yellow)}
.side .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side .opts button{position:relative;min-height:clamp(46px,8.5vh,66px);border-radius:14px;background:var(--panel2);border:2px solid color-mix(in srgb,var(--c) 45%,transparent);
  font-size:clamp(1.05rem,4.8vw,1.45rem);font-weight:900;font-variant-numeric:tabular-nums;transition:transform .08s}
.side .opts button:active{transform:scale(.95)}
.side .opts button.right{background:rgba(57,255,20,.3);border-color:var(--green)}
.side .opts button.wrong{background:rgba(255,59,92,.3);border-color:var(--red)}
.side .opts .kh{position:absolute;top:3px;left:7px;font-size:.62rem;color:var(--muted);font-weight:700}
.side.locked .opts{opacity:.45;pointer-events:none}
.side .flash{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem;font-weight:900;pointer-events:none;opacity:0;transition:opacity .2s}
.side .flash.on{opacity:1}
.side .rg{color:var(--muted);font-size:.75rem;font-weight:700}

/* katman */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(7,7,26,.82);backdrop-filter:blur(3px)}
.modal{width:100%;max-width:420px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:22px;background:#120c38;border:2px solid rgba(255,43,214,.5);
  box-shadow:0 0 40px rgba(255,43,214,.3);animation:pop .25s ease-out;text-align:center}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:1.7rem;font-weight:900;color:#ffd6f6;text-shadow:0 0 8px var(--pink),0 0 22px var(--pink)}
.modal p{line-height:1.55}
.modal .mist{text-align:left;display:flex;flex-direction:column;gap:8px;max-height:36vh;overflow:auto}
.modal .mist div{background:rgba(255,255,255,.04);border-radius:12px;padding:8px 10px;font-size:.9rem;line-height:1.5}
.modal .mist b{color:var(--green)}
.newbadge{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.newbadge span{padding:6px 10px;border-radius:999px;background:rgba(255,230,0,.12);border:1.5px solid rgba(255,230,0,.6);font-weight:800;font-size:.85rem}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);z-index:30;padding:10px 16px;border-radius:999px;
  background:#1c1250;border:2px solid var(--yellow);box-shadow:0 0 18px rgba(255,230,0,.45);font-weight:900;white-space:nowrap;animation:pop .25s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){.logo .l1{animation:none}.modal,.toast{animation:none}.qcard.bad{animation:none}}
@media (min-width:900px){.modes{grid-template-columns:repeat(3,1fr)}.mode.wide{grid-column:auto;flex-direction:column;align-items:flex-start;min-height:112px}}
</style>
</head>

<script>
'use strict';

function press(k) {

function showInput() {
  const a = document.getElementById('ans'); if (!a) return;
  if (!G.input) { a.textContent = '?'; a.className = 'ans empty'; return; }
  a.className = 'ans';
  if (G.input.includes('/')) { const [n, d] = G.input.split('/'); a.innerHTML = `${n.startsWith('-') ? MINUS : ''}<span class="fr"><span>${n.replace('-', '') || '&nbsp;'}</span><span>${d || '&nbsp;'}</span></span>`; }
  else a.textContent = G.input.replace('-', MINUS);
}
function onPlayKey(e) {
  if (document.querySelector('.overlay')) return;
  const k = e.key;
  if (/^\d$/.test(k)) { e.preventDefault(); press(k); }
  else if (k === 'Backspace') { e.preventDefault(); press('del'); }
  else if (k === 'Enter') { e.preventDefault(); if (G.waiting) continueAfterWrong(); else press('go'); }
  else if (k === '-' && G.p && G.p.keys.includes('neg')) press('-');
  else if ((k === ',' || k === '.') && G.p && G.p.keys.includes('dec')) press(',');
  else if (k === '/' && G.p && G.p.keys.includes('frac')) press('/');
  else if (k === 'Escape') finishPlay(true);
}
function submit() {
  if (!G.input || G.input === '-') return;
  const p = me(), q = G.p, res = check(q, G.input.replace(',', ','));
  const st = tstat(p, q.topic);
  st.n++; p.n++;
  G.lock = true;
  const qc = document.getElementById('qc'), fb = document.getElementById('fb');
  if (q.table) { const [a, b] = q.table; const i1 = (a - 1) * 10 + b - 1, i2 = (b - 1) * 10 + a - 1; for (const i of new Set([i1, i2])) p.table[i] = res.ok ? Math.min(3, p.table[i] + 1) : Math.max(0, p.table[i] - 2); }
  if (res.ok) {
    G.ok++; G.streak++; G.best = Math.max(G.best, G.streak); st.ok++; p.ok++; st.s++; st.w = 0;
    if (st.s >= 3 && st.d < 5) { st.d++; st.s = 0; }
    p.bestStreak = Math.max(p.bestStreak, G.streak);
    const gain = (G.tipShown ? 5 : 10) + Math.floor(G.streak / 5) * 2; G.xp += gain; const before = levelOf(p.xp).n; p.xp += gain;
    const dl = dailyOf(p); dl.count++;
    if (dl.count === GOAL) { const y = new Date(Date.now() - 864e5); const yd = `${y.getFullYear()}-${String(y.getMonth() + 1).padStart(2, '0')}-${String(y.getDate()).padStart(2, '0')}`; dl.streak = dl.last === yd ? dl.streak + 1 : 1; dl.last = day(); toast('🎯 Günlük hedef tamam!'); confetti(80); }
    if (G.mode === 'train' && G.bad === 0) p.perfect = Math.max(p.perfect, G.ok);
    qc.classList.add('ok'); fb.className = 'feedback ok'; fb.innerHTML = res.note ? res.note : pick(T.praise) + (G.streak >= 5 && G.streak % 5 === 0 ? ` 🔥 ${G.streak} seri!` : '');
    sfx.ok(G.streak);
    if (levelOf(p.xp).n > before) { toast(`⭐ Seviye ${levelOf(p.xp).n}! ${levelOf(p.xp).title}`); sfx.win(); }
    const nb = checkBadges(p); if (nb.length) { G.newBadges.push(...nb); nb.forEach((b, i) => setTimeout(() => { toast(`${b.e} Yeni rozet: ${b.n}`); sfx.badge(); }, 300 + i * 900)); }
    save(); updHud();
    setTimeout(() => { if (G && G.p === q) nextQ(); }, res.note ? 1600 : 650);
  } else {
    G.bad++; G.streak = 0; st.s = 0; st.w++;
    if (st.w >= 2 && st.d > 1) { st.d--; st.w = 0; }
    G.mistakes.push({ q: q.q, a: ansHTML(q.a), hint: q.hint, yours: G.input });
    if (G.mode === 'train' && !q.review) G.review.push({ p: Object.assign({}, q), due: G.count + 3 });
    qc.classList.add('bad'); sfx.bad(); save(); updHud();
    if (G.mode === 'time') {
      fb.innerHTML = `<span style="color:#ff8095">Doğrusu: ${ansHTML(q.a)}</span>`;
      setTimeout(() => { if (G && G.p === q) nextQ(); }, 1200);
    } else {
      G.waiting = true;
      document.getElementById('extra').innerHTML = `<div class="explain"><div class="ca">Doğru cevap: <b>${ansHTML(q.a)}</b></div>
        <div class="yours">Senin cevabın: ${esc(G.input.replace('-', MINUS))}${res.note ? ' — ' + res.note : ''}</div><div class="how">${q.hint}</div>
        <button class="btn primary small" id="cont">Anladım, devam ▶</button></div>`;
      document.getElementById('pad').style.display = 'none';
      document.getElementById('cont').addEventListener('click', continueAfterWrong);
      document.getElementById('cont').focus();
    }
  }
}
function continueAfterWrong() { if (!G || !G.waiting) return; G.waiting = false; document.getElementById('pad').style.display = ''; nextQ(); }
function updHud() {
  const s = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  s('hOk', G.ok); s('hSt', G.streak); if (G.mode !== 'time') s('hX', G.xp);
}
function finishPlay(early) {
  if (!G) return; const p = me(); const g = G;
  if (cleanup) { cleanup(); cleanup = null; }
  keyHandler = null; G = null;
  if (g.ok + g.bad === 0) return go('home');
  let rec = false;
  if (g.mode === 'time' && !early) { const k = 't' + g.dur; if (g.ok > (p.best[k] || 0)) { p.best[k] = g.ok; rec = true; } const nb = checkBadges(p); g.newBadges.push(...nb); save(); }
  const acc = Math.round(g.ok / Math.max(1, g.ok + g.bad) * 100), mins = Math.max(1, Math.round((performance.now() - g.start) / 60000));
  if (rec || acc === 100) { confetti(); sfx.win(); }
  const title = g.mode === 'time' ? (early ? 'Yarıda bırakıldı' : rec ? 'Yeni rekor! 🏆' : 'Süre doldu!') : acc >= 90 ? 'Harika iş! 🌟' : acc >= 70 ? 'Çok iyi! 👏' : 'Güzel çalıştın! 💪';
  overlay(`<h3>${title}</h3>
    <div class="kv"><div><b>${g.ok}</b><small>doğru</small></div><div><b>${g.bad}</b><small>yanlış</small></div><div><b>%${acc}</b><small>başarı</small></div></div>
    <div class="kv"><div><b>+${g.xp}</b><small>XP</small></div><div><b>${g.best}</b><small>en uzun seri</small></div><div><b>${g.mode === 'time' ? (p.best['t' + g.dur] || 0) : '~' + mins + ' dk'}</b><small>${g.mode === 'time' ? 'rekor' : 'süre'}</small></div></div>
    ${g.newBadges.length ? `<p><b>Yeni rozetler</b></p><div class="newbadge">${g.newBadges.map(b => `<span>${b.e} ${b.n}</span>`).join('')}</div>` : ''}
    ${g.mistakes.length ? `<p><b>Yanlışlarını tekrar gözden geçir</b></p><div class="mist">${g.mistakes.slice(-8).map(m => `<div>${m.q} = <b>${m.a}</b><br><span style="color:var(--muted)">${m.hint}</span></div>`).join('')}</div>` : ''}`,
    [['Tekrar oyna ▶', 'primary', () => startPlay({ mode: g.mode, dur: g.dur, topics: g.topics, row: g.row })], ['Ana menü', 'ghost', () => go(g.mode === 'table' ? 'table' : 'home')]]);
  go(g.mode === 'table' ? 'table' : 'home');
}

/* ---------- ilerleme ---------- */

  const p = me(), L = levelOf(p.xp);
  const list = TOPICS.filter(t => p.topics[t.id] && p.topics[t.id].n);
  render(`${topBar('İlerlemem')}
  <div class="scroll"><div class="wrap">
    <div class="card prof"><span class="avatar" style="--c:${p.color}">${esc(p.name[0] || '?').toLocaleUpperCase('tr')}</span>
      <span class="info"><span class="nm">${esc(p.name)}</span><span class="sub">Seviye ${L.n} · ${L.title} · ${p.xp} XP</span><span class="xpbar"><i style="width:${L.pct}%"></i></span></span></div>
    <div class="kv"><div><b>${p.ok}</b><small>toplam doğru</small></div><div><b>%${p.n ? Math.round(p.ok / p.n * 100) : 0}</b><small>başarı</small></div><div><b>${p.bestStreak}</b><small>en uzun seri</small></div></div>
    <div class="kv"><div><b>${p.table.filter(v => v >= 3).length}</b><small>tablo kutusu</small></div><div><b>${p.daily.streak}</b><small>gün serisi</small></div><div><b>${p.raceWins}</b><small>yarış galibiyeti</small></div></div>
    <span class="lbl">Konular</span>
    <div class="card tbars">${list.length ? list.map(t => { const s = p.topics[t.id], acc = Math.round(s.ok / s.n * 100); return `<div class="tbar" style="--c:${t.c}"><span class="n">${t.name} <span class="stars">${'★'.repeat(s.d)}${'☆'.repeat(5 - s.d)}</span></span><span class="p">${s.ok}/${s.n} · %${acc}</span><span class="b"><i style="width:${acc}%"></i></span></div>`; }).join('') : '<p class="note">Antrenmana başlayınca konuların burada görünecek.</p>'}</div>
    <p class="note">Yıldızlar o konudaki zorluk seviyeni gösterir. Art arda doğrularla artar.</p>
    <span class="lbl">Rozetler · ${Object.keys(p.badges).length}/${BADGES.length}</span>
    <div class="badges">${BADGES.map(b => `<div class="badge ${p.badges[b.id] ? 'on' : ''}"><span class="e">${b.e}</span><b>${b.n}</b><small>${b.d}</small></div>`).join('')}</div>
  </div></div>`);
}

/* ---------- iki kişilik yarış ---------- */
const GUEST = [{ name: 'Oyuncu 1', color: '#ff2bd6' }, { name: 'Oyuncu 2', color: '#00f0ff' }];
let RS = null;
function screenRaceSetup() {
  if (!RS) RS = { pl: [{ pid: DB.cur, grade: me().grade }, { pid: (DB.profiles.find(p => p.id !== DB.cur) || {}).id || null, grade: me().grade }], target: 10, face: true };
  const side = i => {
    const s = RS.pl[i];
    return `<div class="card" style="display:flex;flex-direction:column;gap:10px;border-color:${i ? 'rgba(0,240,255,.5)' : 'rgba(255,43,214,.5)'}">
      <b style="color:${i ? 'var(--cyan)' : 'var(--pink)'}">${i + 1}. Oyuncu</b>
      <div class="chips">${DB.profiles.map(p => `<button class="chip" data-p="${i}" data-id="${p.id}" aria-pressed="${s.pid === p.id}" style="--c:${p.color}">${esc(p.name)}</button>`).join('')}<button class="chip" data-p="${i}" data-id="" aria-pressed="${!s.pid}" style="--c:#fff">Misafir</button></div>
      <span class="lbl">Sorular kaçıncı sınıftan?</span>
      <div class="grades">${[1, 2, 3, 4, 5, 6, 7, 8].map(g => `<button class="chip" data-gp="${i}" data-g="${g}" aria-pressed="${s.grade === g}" style="--c:var(--yellow)">${g}</button>`).join('')}</div></div>`;
  };
  render(`${topBar('İki Kişilik Yarış')}
  <div class="scroll"><div class="wrap">
    <p class="note">Her oyuncu kendi sınıfından soru çözer; böylece abla–kardeş, anne–çocuk adil yarışır. Doğru şıkka ilk basan puanı alır, yanlışta 1,5 saniye bekler.</p>
    ${side(0)}${side(1)}
    <span class="lbl">Kaç puana?</span>
    <div class="chips">${[10, 15, 20].map(t => `<button class="chip" data-tg="${t}" aria-pressed="${RS.target === t}" style="--c:var(--green)">${t} puan</button>`).join('')}</div>
    <span class="lbl">Ekran düzeni</span>
    <div class="chips"><button class="chip" data-face="1" aria-pressed="${RS.face}">Karşılıklı (telefon masada)</button><button class="chip" data-face="0" aria-pressed="${!RS.face}">Yan yana</button></div>
    <button class="btn primary" id="start">Yarışı başlat ▶</button>
    <p class="note">Bilgisayarda: 1. oyuncu 1-2-3-4, 2. oyuncu 7-8-9-0 tuşları.</p>
  </div></div>`);
  $v.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.p; RS.pl[i].pid = b.dataset.id || null; const pr = DB.profiles.find(p => p.id === RS.pl[i].pid); if (pr) RS.pl[i].grade = pr.grade; screenRaceSetup(); }));
  $v.querySelectorAll('[data-gp]').forEach(b => b.addEventListener('click', () => { RS.pl[+b.dataset.gp].grade = +b.dataset.g; screenRaceSetup(); }));
  $v.querySelectorAll('[data-tg]').forEach(b => b.addEventListener('click', () => { RS.target = +b.dataset.tg; screenRaceSetup(); }));
  $v.querySelectorAll('[data-face]').forEach(b => b.addEventListener('click', () => { RS.face = b.dataset.face === '1'; screenRaceSetup(); }));
  $v.querySelector('#start').addEventListener('click', startRace);
}
let RC = null;
function startRace() {
  const pls = RS.pl.map((s, i) => { const pr = DB.profiles.find(p => p.id === s.pid); return { pr, name: pr ? pr.name : GUEST[i].name, color: i === 0 ? (pr ? pr.color : GUEST[0].color) : (pr ? pr.color : GUEST[1].color), grade: s.grade, score: 0, q: null, ch: [], lock: 0, d: 2 }; });
  if (pls[0].color === pls[1].color) pls[1].color = pls[0].color === '#00f0ff' ? '#ff2bd6' : '#00f0ff';
  RC = { pls, target: RS.target, over: false, timers: [] };
  const vertical = RS.face && innerWidth < innerHeight * 1.1;
  const kh = ['1234', '7890'];
  render(`<div class="bar"><button class="icon-btn" id="quit" aria-label="Çık">${ICON.x}</button><h2>Yarış · ${RC.target} puan</h2>${sndBtn()}</div>
    <div class="race ${vertical ? 'v' : ''}">${pls.map((pl, i) => `
      <div class="side ${i === 0 && vertical ? 'flip' : ''}" id="s${i}" style="--c:${pl.color}">
        <div class="top"><span class="who">${esc(pl.name)}</span><span class="rg">${pl.grade}. sınıf</span><span class="sc" id="sc${i}">0</span></div>
        <div class="prog"><i id="pg${i}" style="width:0"></i></div>
        <div class="rq" id="rq${i}"></div>
        <div class="opts" id="op${i}">${[0, 1, 2, 3].map(k => `<button data-pl="${i}" data-o="${k}"><span class="kh">${kh[i][k]}</span><span class="tx"></span></button>`).join('')}</div>
        <div class="flash" id="fl${i}"></div>
      </div>`).join('')}</div>`, e => {
    if (document.querySelector('.overlay')) return;
    const a = kh[0].indexOf(e.key), b = kh[1].indexOf(e.key);
    if (a >= 0) { e.preventDefault(); answerRace(0, a); } else if (b >= 0) { e.preventDefault(); answerRace(1, b); }
    else if (e.key === 'Escape') endRace(true);
  });
  $v.querySelector('#quit').addEventListener('click', () => endRace(true));
  $v.querySelectorAll('[data-pl]').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); audio(); answerRace(+b.dataset.pl, +b.dataset.o); }));
  cleanup = () => { RC && RC.timers.forEach(clearTimeout); };
  pls.forEach((_, i) => raceQ(i));
}
function raceQ(i) {
  const pl = RC.pls[i], list = topicsFor(pl.grade);
  const w = list.map(t => t.g[0] >= pl.grade - 2 ? 3 : 1); let r = Math.random() * w.reduce((a, b) => a + b, 0), tid = list[0].id;
  for (let k = 0; k < list.length; k++) { r -= w[k]; if (r <= 0) { tid = list[k].id; break; } }
  const q = makeProblem(tid, pl.grade, pl.d);
  pl.q = q; pl.ch = choices(q);
  const rq = document.getElementById('rq' + i); rq.innerHTML = q.q; rq.className = 'rq' + (q.long ? ' long' : '');
  document.querySelectorAll(`#op${i} button`).forEach((b, k) => { b.className = ''; b.querySelector('.tx').innerHTML = ansHTML(pl.ch[k]); });
}
function answerRace(i, k) {
  if (!RC || RC.over) return; const pl = RC.pls[i]; if (pl.lock > performance.now() || !pl.q) return;
  const pick_ = pl.ch[k], ok = ansValue(pick_) === ansValue(pl.q.a) && (pick_.kind !== 'frac' || pick_.n * pl.q.a.d === pl.q.a.n * pick_.d);
  const btns = document.querySelectorAll(`#op${i} button`), side = document.getElementById('s' + i), fl = document.getElementById('fl' + i);
  if (ok) {
    pl.score++; pl.d = Math.min(5, pl.d + (pl.score % 3 === 0 ? 1 : 0)); btns[k].className = 'right'; sfx.ok(pl.score);
    document.getElementById('sc' + i).textContent = pl.score; document.getElementById('pg' + i).style.width = (pl.score / RC.target * 100) + '%';
    if (pl.pr) { pl.pr.ok++; pl.pr.n++; pl.pr.xp += 8; tstat(pl.pr, pl.q.topic).ok++; tstat(pl.pr, pl.q.topic).n++; }
    pl.q = null;
    if (pl.score >= RC.target) { RC.over = true; save(); RC.timers.push(setTimeout(() => endRace(false, i), 500)); return; }
    RC.timers.push(setTimeout(() => raceQ(i), 380));
  } else {
    btns[k].className = 'wrong'; const ri = pl.ch.findIndex(c => ansValue(c) === ansValue(pl.q.a)); if (ri >= 0) btns[ri].className = 'right';
    sfx.bad(); pl.lock = performance.now() + 1500; side.classList.add('locked'); fl.textContent = '⏳'; fl.classList.add('on');
    if (pl.pr) { pl.pr.n++; tstat(pl.pr, pl.q.topic).n++; }
    pl.d = Math.max(1, pl.d - 1); pl.q = null;
    RC.timers.push(setTimeout(() => { side.classList.remove('locked'); fl.classList.remove('on'); if (RC && !RC.over) raceQ(i); }, 1500));
  }
}
function endRace(early, winner) {
  if (!RC) return; const rc = RC; RC = null;
  if (cleanup) { cleanup(); cleanup = null; } keyHandler = null;
  if (early) return go('raceSetup');
  const w = rc.pls[winner], l = rc.pls[1 - winner];
  if (w.pr) { w.pr.raceWins++; checkBadges(w.pr); }
  save(); confetti(160); sfx.win();
  overlay(`<h3 style="color:${w.color};text-shadow:0 0 10px ${w.color},0 0 24px ${w.color}">${esc(w.name)} kazandı! 🏆</h3>
    <div class="kv" style="grid-template-columns:1fr 1fr"><div><b style="color:${w.color}">${w.score}</b><small>${esc(w.name)}</small></div><div><b style="color:${l.color}">${l.score}</b><small>${esc(l.name)}</small></div></div>
    <p>${l.score >= rc.target - 2 ? 'Kıl payı! Çok çekişmeliydi.' : 'Rövanş zamanı mı?'}</p>`,
    [['Rövanş ▶', 'primary', startRace], ['Ayarlar', 'ghost', () => go('raceSetup')], ['Ana menü', 'ghost', () => go('home')]]);
}

const SCREENS = { home: screenHome, profiles: screenProfiles, topics: screenTopics, timeSetup: screenTimeSetup, table: screenTable, progress: screenProgress, raceSetup: screenRaceSetup };
go('home');
window.NeonHesap = { TOPICS, makeProblem, check, choices, ansHTML, ansValue, ek, DB, game: () => G, race: () => RC };
</script>
